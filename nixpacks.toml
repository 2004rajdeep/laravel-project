# Railway Nixpacks Configuration for Laravel + React
# This file tells Railway how to build and run the application

[phases.setup]
nixPkgs = [
  "php83",
  "php83Extensions.pdo_pgsql",
  "php83Extensions.pdo_mysql",
  "php83Extensions.redis",
  "php83Extensions.gd",
  "php83Extensions.intl",
  "php83Extensions.opcache",
  "php83Extensions.mbstring",
  "php83Extensions.xml",
  "php83Extensions.zip",
  "php83Extensions.bcmath",
  "nodejs_20",
  "npm",
  "postgresql_client",
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "npm ci",
]

[phases.build]
cmds = [
  "npm run build",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache",
]

[phases.deploy]
cmds = [
  "php artisan migrate --force",
]

[start]
cmd = "bash railway-start.sh"

[variables]
# These will be overridden by Railway's environment variables
PHP_OPCACHE_ENABLE = "1"
PHP_OPCACHE_JIT = "1255"